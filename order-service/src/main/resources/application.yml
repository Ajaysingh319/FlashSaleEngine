server:
  port: 8084

spring:
  application:
    name: order-service
  data:
    mongodb:
      uri: mongodb://mongo1:27017,mongo2:27018,mongo3:27017/order_db?replicaSet=rs0
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${ORDER_KAFKA_CONSUMER_GROUP:order-service}
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed
    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

reservation:
  service:
    url: ${RESERVATION_SERVICE_URL:http://localhost:8083}

catalog:
  service:
    url: ${CATALOG_SERVICE_URL:http://localhost:8082}

order:
  kafka:
    payment-result-consumer-group: ${ORDER_PAYMENT_RESULT_CONSUMER_GROUP:order-payment-results}
    outbox-publish-interval: ${ORDER_OUTBOX_PUBLISH_INTERVAL:5000}
    topics:
      created: ${ORDER_CREATED_TOPIC:order.created}
      cancelled: ${ORDER_CANCELLED_TOPIC:order.cancelled}
      confirmed: ${ORDER_CONFIRMED_TOPIC:order.confirmed}
      payment-failed: ${ORDER_PAYMENT_FAILED_TOPIC:order.payment_failed}
      payment-completed: ${PAYMENT_COMPLETED_TOPIC:payment.completed}
      payment-result-failed: ${PAYMENT_FAILED_TOPIC:payment.failed}

app:
  jwt:
    secret: ${JWT_SECRET:flash-sale-engine-secret-key-change-in-production}

# Logging
logging:
  level:
    com.flashsale: info
    org.springframework: warn
