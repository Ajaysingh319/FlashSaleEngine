server:
  port: 8084

spring:
  application:
    name: order-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongo1:27017,mongo2:27017,mongo3:27017/order_db?replicaSet=rs0}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ${ORDER_KAFKA_CONSUMER_GROUP:order-service}
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed
    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

reservation:
  service:
    url: ${RESERVATION_SERVICE_URL:http://localhost:8083}

order:
  expiry:
    # How often unpaid orders past their reservation expiry are marked EXPIRED (milliseconds)
    check-interval: ${ORDER_EXPIRY_CHECK_INTERVAL:60000}
  kafka:
    payment-result-consumer-group: ${ORDER_PAYMENT_RESULT_CONSUMER_GROUP:order-payment-results}
    outbox-publish-interval: ${ORDER_OUTBOX_PUBLISH_INTERVAL:5000}
    topics:
      created: ${ORDER_CREATED_TOPIC:order.created}
      cancelled: ${ORDER_CANCELLED_TOPIC:order.cancelled}
      confirmed: ${ORDER_CONFIRMED_TOPIC:order.confirmed}
      payment-failed: ${ORDER_PAYMENT_FAILED_TOPIC:order.payment_failed}
      payment-requested: ${PAYMENT_REQUESTED_TOPIC:payment.requested}
      payment-refund-requested: ${PAYMENT_REFUND_REQUESTED_TOPIC:payment.refund_requested}
      payment-completed: ${PAYMENT_COMPLETED_TOPIC:payment.completed}
      payment-result-failed: ${PAYMENT_FAILED_TOPIC:payment.failed}

app:
  jwt:
    # 256-bit Base64-encoded secret for HS256 JWT validation
    secret: ${JWT_SECRET:Zmxhc2gtc2FsZS1lbmdpbmUtc2VjcmV0LWtleS0zMmIh}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.flashsale: info
    org.springframework: warn
