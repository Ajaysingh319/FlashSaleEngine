server:
  port: 8085

spring:
  application:
    name: payment-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongo1:27017,mongo2:27017,mongo3:27017/payment_db?replicaSet=rs0}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ${PAYMENT_KAFKA_CONSUMER_GROUP:payment-service}
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed
    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

payment:
  kafka:
    consumer-group: ${PAYMENT_KAFKA_CONSUMER_GROUP:payment-service}
    outbox-publish-interval: ${PAYMENT_OUTBOX_PUBLISH_INTERVAL:5000}
    topics:
      requested: ${PAYMENT_REQUESTED_TOPIC:order.created}
      completed: ${PAYMENT_COMPLETED_TOPIC:payment.completed}
      failed: ${PAYMENT_FAILED_TOPIC:payment.failed}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.flashsale: info
    org.springframework: warn
