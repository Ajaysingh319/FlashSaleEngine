server:
  port: 8083

spring:
  application:
    name: reservation-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongo1:27017,mongo2:27017,mongo3:27017/reservation_db?replicaSet=rs0}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    deserialization:
      # Reject fractional JSON numbers for integer fields (e.g. quantity 2.5) instead of truncating them.
      accept-float-as-int: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true

catalog:
  service:
    url: ${CATALOG_SERVICE_URL:http://localhost:8082}
    connect-timeout: ${CATALOG_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${CATALOG_SERVICE_READ_TIMEOUT:3s}

app:
  jwt:
    # 256-bit Base64-encoded secret for HS256 JWT validation
    secret: ${JWT_SECRET:Zmxhc2gtc2FsZS1lbmdpbmUtc2VjcmV0LWtleS0zMmIh}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      # Histogram buckets let Prometheus compute P50/P95/P99 latency across instances (TDD 69, 78)
      percentiles-histogram:
        http.server.requests: true
        mongodb.driver.commands: true
        redis.lock.latency: true

# Logging
logging:
  pattern:
    # Every log line carries the request trace ID (X-Correlation-ID from the Gateway, TDD 68)
    level: "%5p [%X{traceId:-}]"
  level:
    com.flashsale: info
    org.springframework: warn
