server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    # spring-boot-starter-web is on the classpath; Spring Cloud Gateway requires the reactive stack
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - CorrelationId
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Rate-limited high-value operations (PRD 6.11, TDD 54); must precede the broader routes below
        - id: auth-login
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/login
          filters:
            - RateLimit=login, ${LOGIN_RATE_LIMIT:10}
        - id: reservation-create
          uri: ${RESERVATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/reservations
            - Method=POST
          filters:
            - AuthenticationRequired
            - RateLimit=reservation, ${RESERVATION_RATE_LIMIT:10}
        - id: order-create
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/orders
            - Method=POST
          filters:
            - AuthenticationRequired
            - RateLimit=order, ${ORDER_RATE_LIMIT:10}
        - id: payment-initiation
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/orders/{orderId}/payment
            - Method=POST
          filters:
            - AuthenticationRequired
            - RateLimit=payment, ${PAYMENT_RATE_LIMIT:5}
        # Public endpoints - no authentication required
        - id: auth-service-public
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/register, /api/v1/auth/refresh, /api/v1/auth/logout
        - id: catalog-events-public
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/events/{eventId}
            - Method=GET
        - id: catalog-events-list-public
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/events
            - Method=GET
        - id: catalog-ticket-types-public
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/events/{eventId}/ticket-types
            - Method=GET
        # Ticket availability is owned by Reservation Service (PRD 6.4, TDD 5)
        - id: reservation-inventory-by-event-public
          uri: ${RESERVATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/events/{eventId}/inventory
            - Method=GET
        - id: reservation-inventory-by-type-public
          uri: ${RESERVATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/ticket-types/{ticketTypeId}/inventory
            - Method=GET
        # Admin monitoring (PRD 6.14, 16) - ADMIN only, routed to the service that owns the data
        - id: admin-orders
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/admin/orders, /api/v1/admin/orders/**
            - Method=GET
          filters:
            - AuthenticationRequired=ADMIN
        - id: admin-reservations-and-statistics
          uri: ${RESERVATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/admin/reservations/**, /api/v1/admin/events/{eventId}/statistics, /api/v1/admin/statistics
            - Method=GET
          filters:
            - AuthenticationRequired=ADMIN
        # Protected endpoints - require authentication
        - id: user-profile
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/me
          filters:
            - AuthenticationRequired
        - id: auth-service-protected
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - AuthenticationRequired
        # Catalog management writes - ADMIN only (must precede catalog-service-protected; routes match in order)
        - id: catalog-management-admin
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/events/**, /api/v1/ticket-types/**
            - Method=POST,PUT,PATCH,DELETE
          filters:
            - AuthenticationRequired=ADMIN
        - id: catalog-service-protected
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/events/**, /api/v1/ticket-types/**
          filters:
            - AuthenticationRequired
        - id: reservation-service
          uri: ${RESERVATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/reservations/**
          filters:
            - AuthenticationRequired
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - AuthenticationRequired
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - AuthenticationRequired

app:
  jwt:
    # Base64-encoded secret (>= 256 bits) for HS256 JWT validation; must match auth, reservation, and order services
    secret: ${JWT_SECRET:Zmxhc2gtc2FsZS1lbmdpbmUtc2VjcmV0LWtleS0zMmIh}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Per-route limits (above) count requests in this window, per user or per client IP for login
    window: ${RATE_LIMIT_WINDOW:60s}

management:
  health:
    redis:
      # The Gateway keeps routing when Redis is down (rate limiting fails open), so Redis does not decide its health
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets let Prometheus compute P50/P95/P99 latency across instances (TDD 69, 78)
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    com.flashsale: info
    org.springframework.cloud.gateway: info