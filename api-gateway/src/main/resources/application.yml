server:
  port: 8080

spring:
  application:
    name: api-gateway
  credentials:
    # 256-bit Base64-encoded JWT secret matching auth, reservation, and order services
    secret: ${JWT_SECRET:Zmxhc2gtc2FsZS1lbmdpbmUtc2VjcmV0LWtleS0zMmIh}
  cloud:
    gateway:
      default-filters:
        - CorrelationId
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Public endpoints - no authentication required
        - id: auth-service-public
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/register, /api/v1/auth/login, /api/v1/auth/refresh, /api/v1/auth/logout
        - id: catalog-events-public
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/events/{eventId}
            - Method=GET
        - id: catalog-events-list-public
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/events
            - Method=GET
        - id: catalog-ticket-types-public
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/events/{eventId}/ticket-types
            - Method=GET
        - id: catalog-inventory-public
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/events/{eventId}/inventory
            - Method=GET
        - id: catalog-inventory-by-type-public
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/ticket-types/{ticketTypeId}/inventory
            - Method=GET
        # Protected endpoints - require authentication
        - id: auth-service-protected
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - AuthenticationRequired
        - id: catalog-service-protected
          uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/events/**, /api/v1/ticket-types/**
          filters:
            - AuthenticationRequired
        - id: reservation-service
          uri: ${RESERVATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/reservations/**
          filters:
            - AuthenticationRequired
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - AuthenticationRequired
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - AuthenticationRequired

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.flashsale: info
    org.springframework.cloud.gateway: info