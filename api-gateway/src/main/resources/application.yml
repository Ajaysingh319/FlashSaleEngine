server:
  port: 8080

spring:
  application:
    name: api-gateway
  credentials:
    # The secret key for JWT validation (should match the auth-service's secret)
    secret: flash-sale-engine-secret-key-change-in-production
  cloud:
    gateway:
      # Global filters
      default-filters:
        - CorrelationId   # Add correlation ID to requests and responses
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Public endpoints - no authentication required
        - id: auth-service-public
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/register, /api/v1/auth/login, /api/v1/auth/refresh, /api/v1/auth/logout
        - id: catalog-events-public
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/events/{eventId}
            - Method=GET
        - id: catalog-events-list-public
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/events
            - Method=GET
        - id: catalog-ticket-types-public
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/events/{eventId}/ticket-types
            - Method=GET
        - id: catalog-inventory-public
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/events/{eventId}/inventory
            - Method=GET
        - id: catalog-inventory-by-type-public
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/ticket-types/{ticketTypeId}/inventory
            - Method=GET
        # Protected endpoints - require authentication
        - id: auth-service-protected
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**   # If there are any protected auth endpoints, but we treat all as public for now
          filters:
            - AuthenticationRequired
        - id: catalog-service-protected
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/events/**, /api/v1/ticket-types/**
          filters:
            - AuthenticationRequired
        - id: reservation-service
          uri: lb://reservation-service
          predicates:
            - Path=/api/v1/reservations/**
          filters:
            - AuthenticationRequired
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - AuthenticationRequired
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - AuthenticationRequired