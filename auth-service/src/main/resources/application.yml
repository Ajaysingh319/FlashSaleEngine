server:
  port: 8081

spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongo1:27017,mongo2:27017,mongo3:27017/auth_db?replicaSet=rs0}
      auto-index-creation: true

app:
  jwt:
    # 256-bit Base64-encoded secret for HS256 JWT signing
    secret: ${JWT_SECRET:Zmxhc2gtc2FsZS1lbmdpbmUtc2VjcmV0LWtleS0zMmIh}
    expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds
  admin:
    # Initial ADMIN account, created at startup only when both are set (no defaults; never commit real values)
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets let Prometheus compute P50/P95/P99 latency across instances (TDD 69, 78)
      percentiles-histogram:
        http.server.requests: true
        mongodb.driver.commands: true

# Logging
logging:
  pattern:
    # Every log line carries the request trace ID (X-Correlation-ID from the Gateway, TDD 68)
    level: "%5p [%X{traceId:-}]"
  level:
    com.flashsale: info
    org.springframework: warn